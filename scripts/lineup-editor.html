<!doctype html>
<title>Valorant Lineup Editor</title>
<style>
  :root { color-scheme: dark; font: 16px/1.45 system-ui, sans-serif; background:#0b1220; color:#e5edf7; }
  body { max-width: 92rem; margin: 0 auto; padding: 1.5rem; }
  main { display:grid; grid-template-columns:minmax(28rem, 1.2fr) minmax(24rem, .8fr); gap:2rem; }
  .map { position:relative; aspect-ratio:1; background:#111; } .map img, .routes { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; } .route { pointer-events:none; stroke:#39d98a; stroke-width:2.25; vector-effect:non-scaling-stroke; } .route-hit { pointer-events:stroke; stroke:transparent; stroke-width:16; vector-effect:non-scaling-stroke; cursor:pointer; }
  .marker { position:absolute; width:.9rem; height:.9rem; transform:translate(-50%,-50%); border-radius:50%; padding:0; cursor:pointer; }
  .start { border:1px solid #facc15; background:#facc15; } .end { border:1px solid #60a5fa; background:#60a5fa; } .both { border:1px solid #e5edf7; background:linear-gradient(90deg,#facc15 0 50%,#60a5fa 50% 100%); } .draft { box-shadow:0 0 0 .2rem #fff,0 0 .45rem .25rem #60a5fa; }
  form { display:grid; gap:.8rem; } label { display:grid; gap:.3rem; font-weight:650; } input, select, textarea, button { font:inherit; } input, select, textarea { padding:.55rem; background:#162235; border:1px solid #43546d; color:inherit; } textarea { min-height:4rem; }
  .choices, .images { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; } .selection { padding:1rem; background:#162235; } .status { min-height:1.5rem; color:#9fd3ff; } button { padding:.6rem .9rem; cursor:pointer; } .save { background:#0f4c81; color:#fff; border:1px solid #42a5f5; font-weight:700; } .verify { background:#176b45; color:#fff; border:1px solid #39d98a; font-weight:700; } .actions { display:flex; flex-wrap:wrap; gap:.7rem; } .image-preview { display:none; width:100%; max-width:12rem; max-height:7rem; margin-top:.45rem; object-fit:cover; border:1px solid #43546d; } .image-preview.visible { display:block; } .route-switcher { display:flex; align-items:center; gap:.35rem; margin-top:.7rem; color:#c8d5e6; font-weight:700; } .route-switcher button { min-width:1.8rem; height:1.8rem; padding:.1rem .4rem; border:1px solid #43546d; border-radius:.35rem; background:#162235; color:inherit; font-weight:700; } .route-switcher button.active { border-color:#42a5f5; background:#0f4c81; color:#fff; }
  @media (max-width: 52rem) { main { grid-template-columns:1fr; } .choices, .images { grid-template-columns:1fr; } }
</style>
<h1>Valorant Lineup Editor</h1>
<p>Pick Start or End, then click an existing marker to reuse it—or click the map to create a new location.</p>
<p><a href="/test">Test unverified lineups</a></p>
<main>
  <section>
    <div class="choices"><label>Map<select id="map-id"></select></label><label>Existing lineup<select id="existing-lineup"><option value="">New lineup</option></select></label><label>Editing location<select id="mode"><option value="start">Start</option><option value="end">End</option></select></label><div class="selection" id="selection">Start: not selected<br>End: not selected</div></div>
    <div id="map" class="map"><img src="/minimap.png" alt="Ascent minimap"><svg id="routes" class="routes" viewBox="0 0 100 100" preserveAspectRatio="none" aria-label="Existing lineup paths"></svg></div><nav id="route-switcher" class="route-switcher" aria-label="Lineups for selected route" hidden></nav>
  </section>
  <form id="editor">
    <label>Title<input name="title" required placeholder="B Main to B Site recon"></label>
    <div class="choices"><label>Side<select name="side"><option value="attack">Attack</option><option value="defense">Defense</option><option value="all">All</option></select></label><label>Dart<select name="utility"><option value="recon-dart">Recon</option><option value="shock-dart">Shock</option></select></label></div>
    <label>Where to stand<textarea name="stand"></textarea></label><label>Where to aim<textarea name="aim"></textarea></label><label>Result<textarea name="result"></textarea></label><label>Notes<textarea name="notes"></textarea></label>
    <div class="choices"><label>Bounces<input name="bounces" type="number" min="0" value="0" required></label><label>Charge<input name="charge" type="number" min="0" max="3" value="3" required></label></div>
    <div class="images"><label>Stand image<input name="standImage" type="file" accept="image/*"><img class="image-preview" data-preview="standImage" alt="Stand image preview"></label><label>Aim image 1<input name="aimImage1" type="file" accept="image/*"><img class="image-preview" data-preview="aimImage1" alt="First aim image preview"></label><label>Aim image 2 (optional)<input name="aimImage2" type="file" accept="image/*"><img class="image-preview" data-preview="aimImage2" alt="Second aim image preview"></label><label>Result image<input name="resultImage" type="file" accept="image/*"><img class="image-preview" data-preview="resultImage" alt="Result image preview"></label></div>
    <div class="actions"><button class="save" type="submit" id="save">Create lineup</button><button class="verify" type="button" id="verify" hidden>Verify lineup</button></div><div class="status" id="status" role="status"></div>
  </form>
</main>
<script>
  const map = document.querySelector('#map'), routes = document.querySelector('#routes'), mapId = document.querySelector('#map-id'), existingSelect = document.querySelector('#existing-lineup'), mode = document.querySelector('#mode'), selection = document.querySelector('#selection'), form = document.querySelector('#editor'), status = document.querySelector('#status'), save = document.querySelector('#save'), verify = document.querySelector('#verify'), routeSwitcher = document.querySelector('#route-switcher');
  const testMode = location.pathname === '/test'; if (testMode) { document.title='Test Valorant Lineups'; document.querySelector('h1').textContent='Test unverified lineups'; document.querySelector('body > p').textContent='Review the selected lineup, make any edits needed, then verify it.'; }
  const chosen = { start: null, end: null }; let locations = [], lineups = [], editing = null, selectedRouteLocationId = null, selectedRouteKey = null;
  const slug = value => value.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const routeKey = lineup => `${lineup.startLocationId}::${lineup.endLocationId}`;
  const locationRole = location => { const starts=lineups.some(lineup => lineup.startLocationId===location.id), ends=lineups.some(lineup => lineup.endLocationId===location.id); return starts && ends ? 'both' : starts ? 'start' : ends ? 'end' : location.type || 'start'; };
  function openLineup(lineup) { selectedRouteKey=routeKey(lineup); existingSelect.value=lineup.id; existingSelect.dispatchEvent(new Event('change')); }
  function renderRouteSwitcher() { const group=lineups.filter(lineup => routeKey(lineup)===selectedRouteKey); routeSwitcher.innerHTML=''; routeSwitcher.hidden=group.length<2; if (group.length<2) return; routeSwitcher.append('Lineup'); group.forEach((lineup,index) => { const button=document.createElement('button'); button.type='button'; button.textContent=index+1; button.classList.toggle('active',lineup.id===editing?.id); button.setAttribute('aria-label',`Edit lineup ${index+1}`); button.setAttribute('aria-pressed',String(lineup.id===editing?.id)); button.onclick=() => openLineup(lineup); routeSwitcher.append(button); }); }
  function refresh() { routes.innerHTML=''; const groups=new Map(); lineups.filter(lineup => selectedRouteLocationId && (lineup.startLocationId===selectedRouteLocationId || lineup.endLocationId===selectedRouteLocationId)).forEach(lineup => { const key=routeKey(lineup); groups.set(key,[...(groups.get(key) || []),lineup]); }); groups.forEach(group => { const lineup=group[0], start=locations.find(location => location.id===lineup.startLocationId), end=locations.find(location => location.id===lineup.endLocationId); if (!start || !end) return; ['route-hit','route'].forEach(className => { const line=document.createElementNS('http://www.w3.org/2000/svg','line'); line.setAttribute('x1',start.position.x); line.setAttribute('y1',start.position.y); line.setAttribute('x2',end.position.x); line.setAttribute('y2',end.position.y); line.setAttribute('class',className); if (className==='route-hit') { line.setAttribute('role','button'); line.setAttribute('tabindex','0'); line.setAttribute('aria-label',group.length>1 ? `Edit one of ${group.length} lineups for this route` : `Edit ${lineup.title}`); const open=() => openLineup(lineup); line.addEventListener('click',open); line.addEventListener('keydown',event => { if (event.key==='Enter' || event.key===' ') open(); }); } routes.append(line); }); }); document.querySelectorAll('.marker').forEach(x => x.remove()); locations.forEach(location => marker(location)); Object.values(chosen).filter(Boolean).filter(x => !locations.some(y => y.id === x.id)).forEach(location => marker(location, true)); selection.innerHTML = `Start: ${chosen.start ? chosen.start.label : 'not selected'}<br>End: ${chosen.end ? chosen.end.label : 'not selected'}`; renderRouteSwitcher(); }
  function marker(location, draft = false) { const button = document.createElement('button'); button.type='button'; button.className=`marker ${draft ? location.type : locationRole(location)}${draft ? ' draft' : ''}`; button.setAttribute('aria-label', location.label); button.style.left=`${location.position.x}%`; button.style.top=`${location.position.y}%`; button.title=location.label; button.onclick=event => { event.stopPropagation(); selectedRouteLocationId=location.id; selectedRouteKey=null; chosen[mode.value] = location; status.textContent=`Routes connected to ${location.label}. Click a line to edit it.`; refresh(); }; map.append(button); }
  map.addEventListener('click', event => { if (event.target.closest('.marker, .route-hit')) return; const bounds = map.getBoundingClientRect(), x = +(100 * (event.clientX - bounds.left) / bounds.width).toFixed(4), y = +(100 * (event.clientY - bounds.top) / bounds.height).toFixed(4); const label = prompt(`Name this new ${mode.value} location:`); if (!label) return; const id = slug(prompt('Unique location ID:', slug(label)) || ''); if (!id) return; if (locations.some(location => location.id === id) || Object.values(chosen).some(location => location?.id === id)) return status.textContent='That location ID is already in use.'; chosen[mode.value] = { id, label, type: mode.value, position:{x,y} }; status.textContent=`Created ${label} at ${x}%, ${y}%.`; refresh(); });
  async function image(file) { if (!file || !file.name || file.size===0) return null; return { name:file.name, data:await new Promise((resolve,reject) => { const reader=new FileReader(); reader.onload=()=>resolve(reader.result.split(',')[1]); reader.onerror=reject; reader.readAsDataURL(file); }) }; }
  document.querySelectorAll('input[type="file"]').forEach(input => input.addEventListener('change', () => { const preview=document.querySelector(`[data-preview="${input.name}"]`), file=input.files[0]; if (!file) { preview.removeAttribute('src'); preview.classList.remove('visible'); return; } preview.src=URL.createObjectURL(file); preview.classList.add('visible'); }));
  async function loadMap() { chosen.start=null; chosen.end=null; editing=null; selectedRouteLocationId=null; selectedRouteKey=null; verify.hidden=true; save.textContent='Create lineup'; existingSelect.innerHTML='<option value="">New lineup</option>'; const selected=mapId.value; map.querySelector('img').src=`/minimap.png?map=${encodeURIComponent(selected)}`; const response=await fetch(`/api/map?map=${encodeURIComponent(selected)}`); locations=await response.json(); lineups=await (await fetch(`/api/lineups?map=${encodeURIComponent(selected)}`)).json(); lineups.forEach(lineup => existingSelect.add(new Option(lineup.title, lineup.id))); status.textContent=`Loaded ${mapId.options[mapId.selectedIndex].text}. Click a map marker to reveal its routes.`; refresh(); if (testMode) { const next=lineups.find(lineup => !lineup.verified); if (next) { openLineup(next); status.textContent=`Testing ${next.title}.`; } else { status.textContent='All lineups on this map are verified.'; } } }
  mapId.addEventListener('change', loadMap);
  existingSelect.addEventListener('change', () => { editing=lineups.find(lineup => lineup.id===existingSelect.value) || null; if (!editing) { selectedRouteKey=null; verify.hidden=true; form.reset(); chosen.start=null; chosen.end=null; document.querySelectorAll('.image-preview').forEach(preview => { preview.removeAttribute('src'); preview.classList.remove('visible'); }); save.textContent='Create lineup'; refresh(); return; } selectedRouteKey=routeKey(editing); verify.hidden=editing.verified; ['title','side','utility','stand','aim','result','notes','bounces','charge'].forEach(key => { if (form.elements[key]) form.elements[key].value=editing[key] ?? ''; }); [['standImage',editing.media.standImage],['aimImage1',editing.media.aimImages?.[0] || editing.media.aimImage],['aimImage2',editing.media.aimImages?.[1]],['resultImage',editing.media.resultImage]].forEach(([field,source]) => { const preview=document.querySelector(`[data-preview="${field}"]`); if (source) { preview.src=`/${source}`; preview.classList.add('visible'); } else { preview.removeAttribute('src'); preview.classList.remove('visible'); } }); chosen.start=locations.find(location => location.id===editing.startLocationId) || null; chosen.end=locations.find(location => location.id===editing.endLocationId) || null; save.textContent='Save changes'; status.textContent=`Editing ${editing.title}.`; refresh(); });
  verify.addEventListener('click', () => { if (!editing) return; editing.verified=true; form.requestSubmit(); });
  form.addEventListener('submit', async event => { event.preventDefault(); if (!chosen.start || !chosen.end) return status.textContent='Choose both a start and end location first.'; const fields = new FormData(form); const isVerifying=Boolean(editing?.verified); status.textContent=isVerifying ? 'Verifying lineup…' : editing ? 'Saving changes…' : 'Creating lineup…'; const payload = Object.fromEntries(['title','side','utility','stand','aim','result','notes','bounces','charge'].map(key => [key, fields.get(key)])); payload.mapId=mapId.value; payload.start=chosen.start; payload.end=chosen.end; payload.existingId=editing?.id || ''; payload.existingMedia=editing?.media || {}; payload.verified=Boolean(editing?.verified); payload.images={ stand:await image(fields.get('standImage')), aim1:await image(fields.get('aimImage1')), aim2:await image(fields.get('aimImage2')), result:await image(fields.get('resultImage')) }; const response=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); const data=await response.json(); if (!response.ok) return status.textContent=data.error; if (testMode && isVerifying) return loadMap(); status.textContent=`${isVerifying ? 'Verified' : editing ? 'Saved' : 'Created'} ${data.id}. Run npm run build to verify it.`; verify.hidden=isVerifying; });
  fetch('/api/maps').then(r => r.json()).then(data => { data.forEach(item => mapId.add(new Option(item.name, item.id))); return loadMap(); }).catch(() => status.textContent='Could not load maps.');
</script>
