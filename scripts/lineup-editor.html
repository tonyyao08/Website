<!doctype html>
<title>Valorant Lineup Editor</title>
<style>
  :root { color-scheme: dark; font: 16px/1.45 system-ui, sans-serif; background:#0b1220; color:#e5edf7; }
  body { max-width: 92rem; margin: 0 auto; padding: 1.5rem; }
  main { display:grid; grid-template-columns:minmax(28rem, 1.2fr) minmax(24rem, .8fr); gap:2rem; }
  .map { position:relative; aspect-ratio:1; background:#111; } .map img { width:100%; height:100%; object-fit:contain; }
  .marker { position:absolute; transform:translate(-50%,-50%); border:0; background:transparent; font:400 2rem/1 system-ui; text-shadow:0 1px 3px #000; cursor:pointer; }
  .start { color:#facc15; } .end { color:#ef4444; } .draft { outline:2px solid #fff; border-radius:50%; }
  form { display:grid; gap:.8rem; } label { display:grid; gap:.3rem; font-weight:650; } input, select, textarea, button { font:inherit; } input, select, textarea { padding:.55rem; background:#162235; border:1px solid #43546d; color:inherit; } textarea { min-height:4rem; }
  .choices, .images { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; } .selection { padding:1rem; background:#162235; } .status { min-height:1.5rem; color:#9fd3ff; } button { padding:.6rem .9rem; cursor:pointer; } .save { background:#0f4c81; color:#fff; border:1px solid #42a5f5; font-weight:700; } .image-preview { display:none; width:100%; max-width:12rem; max-height:7rem; margin-top:.45rem; object-fit:cover; border:1px solid #43546d; } .image-preview.visible { display:block; }
  @media (max-width: 52rem) { main { grid-template-columns:1fr; } .choices, .images { grid-template-columns:1fr; } }
</style>
<h1>Valorant Lineup Editor</h1>
<p>Pick Start or End, then click an existing marker to reuse it—or click the map to create a new location.</p>
<main>
  <section>
    <div class="choices"><label>Map<select id="map-id"></select></label><label>Editing location<select id="mode"><option value="start">Start</option><option value="end">End</option></select></label><div class="selection" id="selection">Start: not selected<br>End: not selected</div></div>
    <div id="map" class="map"><img src="/minimap.png" alt="Ascent minimap"></div>
  </section>
  <form id="editor">
    <label>Title<input name="title" required placeholder="B Main to B Site recon"></label>
    <div class="choices"><label>Side<select name="side"><option value="attack">Attack</option><option value="defense">Defense</option><option value="all">All</option></select></label><label>Dart<select name="utility"><option value="recon-dart">Recon</option><option value="shock-dart">Shock</option></select></label></div>
    <label>Where to stand<textarea name="stand"></textarea></label><label>Where to aim<textarea name="aim"></textarea></label><label>Result<textarea name="result"></textarea></label><label>Notes<textarea name="notes"></textarea></label>
    <div class="choices"><label>Bounces<input name="bounces" type="number" min="0" value="0" required></label><label>Charge description<input name="charge" value="3 charge"></label></div>
    <div class="images"><label>Stand image<input name="standImage" type="file" accept="image/*"><img class="image-preview" data-preview="standImage" alt="Stand image preview"></label><label>Aim image<input name="aimImage" type="file" accept="image/*"><img class="image-preview" data-preview="aimImage" alt="Aim image preview"></label><label>Result image<input name="resultImage" type="file" accept="image/*"><img class="image-preview" data-preview="resultImage" alt="Result image preview"></label></div>
    <button class="save" type="submit">Create lineup</button><div class="status" id="status" role="status"></div>
  </form>
</main>
<script>
  const map = document.querySelector('#map'), mapId = document.querySelector('#map-id'), mode = document.querySelector('#mode'), selection = document.querySelector('#selection'), form = document.querySelector('#editor'), status = document.querySelector('#status');
  const chosen = { start: null, end: null }; let locations = [];
  const slug = value => value.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  function refresh() { document.querySelectorAll('.marker').forEach(x => x.remove()); locations.forEach(location => marker(location)); Object.values(chosen).filter(Boolean).filter(x => !locations.some(y => y.id === x.id)).forEach(location => marker(location, true)); selection.innerHTML = `Start: ${chosen.start ? chosen.start.label : 'not selected'}<br>End: ${chosen.end ? chosen.end.label : 'not selected'}`; }
  function marker(location, draft = false) { const button = document.createElement('button'); button.type='button'; button.className=`marker ${location.type}${draft ? ' draft' : ''}`; button.textContent=location.type === 'start' ? 'O' : 'X'; button.style.left=`${location.position.x}%`; button.style.top=`${location.position.y}%`; button.title=location.label; button.onclick=event => { event.stopPropagation(); if (location.type !== mode.value) return status.textContent=`Choose ${location.type === 'start' ? 'Start' : 'End'} mode to use ${location.label}.`; chosen[mode.value] = location; status.textContent=`Using ${location.label}.`; refresh(); }; map.append(button); }
  map.addEventListener('click', event => { if (event.target !== map.querySelector('img')) return; const bounds = map.getBoundingClientRect(), x = +(100 * (event.clientX - bounds.left) / bounds.width).toFixed(4), y = +(100 * (event.clientY - bounds.top) / bounds.height).toFixed(4); const label = prompt(`Name this new ${mode.value} location:`); if (!label) return; const id = slug(prompt('Unique location ID:', slug(label)) || ''); if (!id) return; if (locations.some(location => location.id === id) || Object.values(chosen).some(location => location?.id === id)) return status.textContent='That location ID is already in use.'; chosen[mode.value] = { id, label, type: mode.value, position:{x,y} }; status.textContent=`Created ${label} at ${x}%, ${y}%.`; refresh(); });
  async function image(file) { if (!file) return null; return { name:file.name, data:await new Promise((resolve,reject) => { const reader=new FileReader(); reader.onload=()=>resolve(reader.result.split(',')[1]); reader.onerror=reject; reader.readAsDataURL(file); }) }; }
  document.querySelectorAll('input[type="file"]').forEach(input => input.addEventListener('change', () => { const preview=document.querySelector(`[data-preview="${input.name}"]`), file=input.files[0]; if (!file) { preview.removeAttribute('src'); preview.classList.remove('visible'); return; } preview.src=URL.createObjectURL(file); preview.classList.add('visible'); }));
  async function loadMap() { chosen.start=null; chosen.end=null; const selected=mapId.value; map.querySelector('img').src=`/minimap.png?map=${encodeURIComponent(selected)}`; const response=await fetch(`/api/map?map=${encodeURIComponent(selected)}`); locations=await response.json(); status.textContent=`Loaded ${mapId.options[mapId.selectedIndex].text}.`; refresh(); }
  mapId.addEventListener('change', loadMap);
  form.addEventListener('submit', async event => { event.preventDefault(); if (!chosen.start || !chosen.end) return status.textContent='Choose both a start and end location first.'; const fields = new FormData(form); status.textContent='Creating lineup…'; const payload = Object.fromEntries(['title','side','utility','stand','aim','result','notes','bounces','charge'].map(key => [key, fields.get(key)])); payload.mapId=mapId.value; payload.start=chosen.start; payload.end=chosen.end; payload.images={ stand:await image(fields.get('standImage')), aim:await image(fields.get('aimImage')), result:await image(fields.get('resultImage')) }; const response=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); const data=await response.json(); status.textContent=response.ok ? `Created ${data.id}. Run npm run build to verify it.` : data.error; });
  fetch('/api/maps').then(r => r.json()).then(data => { data.forEach(item => mapId.add(new Option(item.name, item.id))); return loadMap(); }).catch(() => status.textContent='Could not load maps.');
</script>
